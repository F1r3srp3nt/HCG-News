name: iOS release qualification

# Builds and tests HCG News with Xcode 26 on macOS, on iPhone and iPad simulators, and audits an
# unsigned Release archive. Nothing is signed, uploaded to TestFlight or submitted.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["iOS app/**", ".github/workflows/ios-qualification.yml", ".github/scripts/**"]

concurrency:
  group: ios-qualification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: "iOS app/HCGNews/HCGNews.xcodeproj"
  PACKAGE: "iOS app/HCGNews/HCGNewsKit"

jobs:
  package-macos:
    name: Package tests (macOS, Xcode 26)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      - name: swift test
        run: swift test --package-path "$PACKAGE" 2>&1 | tee swift-test.log | grep -E "error:|failed|Executed .* tests|passed after|Test run with" | tail -40; exit ${PIPESTATUS[0]}

  ui-tests:
    name: Build and test (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 and a simulator
        id: sim
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun simctl list runtimes
          IFS=$'\t' read -r UDID NAME RUNTIME < <(python3 .github/scripts/pick-simulator.py ${{ matrix.device }})
          echo "Using $NAME ($RUNTIME) $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Build for testing (Debug, simulator)
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project "$PROJECT" -scheme HCGNews \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)|\*\* " | tail -150
      - name: Run unit and UI tests
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test-without-building -project "$PROJECT" -scheme HCGNews \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath DerivedData \
            -resultBundlePath "results-${{ matrix.device }}.xcresult" -parallel-testing-enabled NO \
            2>&1 | tee test.log | grep -E "Test Case .* (passed|failed)|error:|\*\* TEST" | tail -300
      - name: Summarise results and export screenshots
        if: always()
        run: python3 .github/scripts/xcresult-report.py "results-${{ matrix.device }}.xcresult" "evidence-${{ matrix.device }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.device }}
          path: |
            evidence-${{ matrix.device }}/*.png
            evidence-${{ matrix.device }}/*.jpeg
            evidence-${{ matrix.device }}/*.txt
            evidence-${{ matrix.device }}/tests.tsv
            build.log
            test.log
          retention-days: 30
      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ matrix.device }}
          path: results-${{ matrix.device }}.xcresult
          retention-days: 14
      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  release-audit:
    name: Release archive and audit
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Archive (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild archive -project "$PROJECT" -scheme HCGNews -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/HCGNews.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            2>&1 | tee archive.log | grep -E "error:|warning:|ARCHIVE (SUCCEEDED|FAILED)|\*\* " | tail -150
      - name: Audit the Release build
        run: bash "iOS app/tools/release-audit.sh" "$RUNNER_TEMP/HCGNews.xcarchive" release-audit.md
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-audit
          path: |
            release-audit.md
            archive.log
          retention-days: 30
