# XcodeGen fallback. HCGNews.xcodeproj is committed and is the primary project.
# Use this only if Xcode rejects the committed project file:
#   brew install xcodegen && cd HCGNews && xcodegen generate
name: HCGNews
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  HCGNewsKit:
    path: HCGNewsKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  HCGNews:
    type: application
    platform: iOS
    sources:
      - path: HCGNews
    dependencies:
      - package: HCGNewsKit
        product: NewsCore
      - package: HCGNewsKit
        product: HCGConnect
      - package: HCGNewsKit
        product: NewsAppModel
      - package: HCGNewsKit
        product: HCGTransport
      - package: HCGNewsKit
        product: Newsroom
      - package: HCGNewsKit
        product: HCGPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakmicapitalgroup.hcgnews
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 2
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"HCGNews/Preview Content\""
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_CFBundleDisplayName: HCG News
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  HCGNewsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HCGNewsUITests
    dependencies:
      - target: HCGNews
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hakmicapitalgroup.hcgnews.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HCGNews
schemes:
  HCGNews:
    build:
      targets:
        HCGNews: all
    test:
      targets:
        - HCGNewsUITests
        - package: HCGNewsKit/NewsCoreTests
        - package: HCGNewsKit/HCGConnectTests
        - package: HCGNewsKit/NewsAppModelTests
        - package: HCGNewsKit/NewsroomTests
